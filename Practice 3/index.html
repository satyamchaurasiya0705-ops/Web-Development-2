<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Grade Calculator for 5 Students</h2>

        <input type="number" id="m1" placeholder="Student 1 Marks">
        <input type="number" id="m2" placeholder="Student 2 Marks">
        <input type="number" id="m3" placeholder="Student 3 Marks">
        <input type="number" id="m4" placeholder="Student 4 Marks">
        <input type="number" id="m5" placeholder="Student 5 Marks">

        <button onclick="calculateGrades()">Calculate Grades</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
